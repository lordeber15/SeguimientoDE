# Nombre de proyecto FIJO: sin él, Compose lo deriva de la carpeta desde la que se lanza, y los
# volúmenes se llaman `<proyecto>_db_app_data`. Al cambiar la carpeta se creaba una BD nueva y vacía
# (el RAG respondía "No encontré información" a todo). Este es el volumen con los datos reales.
name: sistemasseguimientode

services:
  # Base de datos PROPIA del sistema: usuarios de la aplicación, roles, auditoría y (más
  # adelante) los embeddings del RAG. Aquí SÍ se escribe — no contradice la política de solo
  # lectura, que aplica exclusivamente a la BD del SGD (`idosgd`, servidor remoto).
  # La imagen trae pgvector ya instalado para no tener que cambiarla en la Fase 3.
  db-app:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${APP_DB_USER:-seguimiento}
      POSTGRES_PASSWORD: ${APP_DB_PASS}
      POSTGRES_DB: ${APP_DB_NAME:-seguimiento_app}
    ports:
      - '${APP_DB_HOST_PORT:-5442}:5432'
    volumes:
      - db_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${APP_DB_USER:-seguimiento} -d ${APP_DB_NAME:-seguimiento_app}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    # host.docker.internal resuelve solo en Docker Desktop (Windows/Mac); en el host Linux de
    # producción hace falta esta línea para que OLLAMA_URL / MARKITDOWN_URL sigan apuntando a
    # servicios que corren en la propia máquina, fuera de Docker.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db-app:
        condition: service_healthy
    ports:
      - '${BACKEND_HOST_PORT:-3012}:${PORT:-3012}'
    # sshfs MANUAL (`docker compose exec -u root backend sgd-sshfs montar usuario@host:/ruta`):
    # FUSE necesita el dispositivo y la capacidad de montar. SYS_ADMIN es amplia, pero node sigue
    # corriendo como appuser; solo la usa root en ese exec explícito. apparmor:unconfined aplica en
    # hosts Linux con AppArmor (Ubuntu); Docker Desktop lo ignora.
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      # Repositorio de documentos y anexos del SGD, montado en SOLO LECTURA (:ro).
      # El SGD es la fuente de verdad de estos archivos y este sistema nunca los modifica;
      # el :ro lo garantiza a nivel de Docker, no solo por convención del código.
      # Si STORAGE_HOST_PATH no está definido (producción con sshfs), en su lugar se monta el
      # volumen con nombre vacío sgd_storage_vacio; el sshfs se monta encima y al desmontar
      # vuelve a verse vacío.
      - ${STORAGE_HOST_PATH:-sgd_storage_vacio}:${STORAGE_PATH:-/mnt/sgd/storage}:ro
      # Repositorio de archivos del STD (tbl_adjunto), también SOLO LECTURA. Mismo mecanismo que
      # el de arriba: si STD_STORAGE_HOST_PATH no está definido (módulo STD apagado o sin
      # configurar todavía), se monta el volumen vacío en su lugar.
      - ${STD_STORAGE_HOST_PATH:-std_storage_vacio}:${STD_STORAGE_PATH:-/mnt/std/uploads}:ro
      # Temporales del PDF unificado. Lectura/escritura: es nuestro directorio de trabajo, no
      # el repositorio del SGD. El servicio solo crea y borra ahí archivos "Union_*.pdf".
      - ${UNION_TMP_DIR}:${UNION_TMP_PATH:-/mnt/sgd/tmp}
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - '${FRONTEND_HOST_PORT:-5177}:${FRONTEND_PORT:-5177}'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Cross-encoder del rerank del chat (docs/PLAN-RAG-AVANZADO.md, Fase 3): Text Embeddings Inference
  # sirviendo un reranker multilingüe, local — los fragmentos no salen del servidor. Lo usa el backend
  # con RAG_RERANK_PROVIDER=local y RERANK_URL=http://reranker:80. Perfil `rerank`: no arranca si no
  # se pide (`docker compose --profile rerank up -d`).
  #
  # Medido el 2026-10-06 (16 núcleos, sin GPU, 20 fragmentos por consulta):
  # - CPU: solo sirven modelos con pesos ONNX. `cross-encoder/mmarco-mMiniLMv2-L12-H384-v1` (118M,
  #   el valor por defecto) tarda ~2,8 s p50 / 3,9 s p95. `BAAI/bge-reranker-v2-m3` no trae ONNX: corre
  #   en candle y tarda ~48 s; con --max-batch-tokens > 2048 además lo mata el OOM al calentar.
  # - GPU NVIDIA (driver con CUDA >= 12.9): imagen `turing-1.9` (T4/T1000) o `1.9` (Ampere+), `gpus: all`
  #   y RERANK_MODEL=BAAI/bge-reranker-v2-m3 — el modelo que el plan apunta para calidad.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:${RERANK_IMAGEN:-cpu-1.9}
    profiles: ['rerank']
    command: ['--model-id', '${RERANK_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}', '--max-client-batch-size', '64', '--max-batch-tokens', '2048']
    ports:
      - '${RERANK_HOST_PORT:-8082}:80'
    volumes:
      # Pesos del modelo: se descargan una vez de Hugging Face y quedan aquí.
      - reranker_modelos:/data
    restart: unless-stopped

  # Métricas LLM de Ragas sobre las corridas de `npm run eval:rag` (docs/PLAN-RAG-AVANZADO.md,
  # Fase 1). Perfil `evals`: no arranca con `docker compose up`, solo a pedido:
  #   docker compose --profile evals run --rm rag-evals /evals/salidas/sgd-12.json
  rag-evals:
    build: ./backend/evals/ragas
    profiles: ['evals']
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./backend/evals:/evals

volumes:
  db_app_data:
  # Punto de montaje vacío para el backend cuando no hay STORAGE_HOST_PATH (ver servicio backend).
  sgd_storage_vacio:
  # Igual, para cuando no hay STD_STORAGE_HOST_PATH.
  std_storage_vacio:
  reranker_modelos:
